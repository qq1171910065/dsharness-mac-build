# dsharness deployment rows.
#
# This file is the fork's own patch layer. It targets rows that upstream already
# declares, so it contains no new plugin: it only changes what the official
# harness points at.
#
# A patch replaces the targeted row's WHOLE config, so the entry below restates
# every key that row owns. See platform/README.md for why each key is there.
#
# name is deliberately omitted: in a non-insert patch name is an assertion, and a
# mismatch makes the patch silently SKIP with a warning. Leaving it out means an
# upstream package rename cannot turn this deployment back into "login talks to
# DeepSeek". The row is identified by id alone.

# A fixed port and an all-interfaces bind, for external integrations.
#
# Why this row exists: the Desktop Host launches the Web application with a
# hard-coded `--port 0` (`apps/desktop-host/src/index.ts:30`), so every launch
# binds a DIFFERENT OS-assigned loopback port. An external caller configured with
# one address therefore goes stale on the next restart and reports "service
# unreachable" -- which is exactly what the sixai integration hit (its
# dsh_instance rows still carried :3080 and :43127 from the previous shell).
# A loopback-only bind is unreachable from another machine in principle, so the
# port being unstable was only half the defect.
#
# The web-app bundle already declares this row, and since a patch replaces the
# targeted row's whole config, the expressions below are the upstream ones with
# the deployment defaults substituted ahead of the literals. Both defaults --
# `0.0.0.0` and `3080` -- are what make an installed client answer on a stable,
# reachable address with NO configuration: the deployment targets are machines
# whose operators cannot set environment variables.
#
# Precedence, highest first:
#   1. `DSH_GATEWAY_HOST` / `DSH_GATEWAY_PORT`   (deployment override)
#   2. `ctx.webStartup.host` / `.port`           (explicit --host/--port)
#   3. `0.0.0.0` / `3080`                        (these defaults)
# `dsh web --port 13096` therefore still wins over 3080, and only the Desktop
# Host's `--port 0` reaches step 3: `0` is the "pick any free port" sentinel, not
# an answer worth honouring, which is why `||` is used rather than `??` there.
#
# ⚠️ Binding all interfaces exposes the full Harness API -- and therefore shell
# execution -- to everyone who can reach the machine. Upstream refuses that bind
# from the command line for this reason (apps/cli/src: "would expose remote code
# execution to the network"). This layer makes it the shipped default anyway,
# because a client that only binds loopback cannot serve the integrations it
# exists to serve. The shared secret remains mandatory for every request
# (`DSH_AUTH_TOKEN`, written into the deployment layer by platform/install.mjs),
# and the installer prints a warning with the security terms.
- id: webserver
  config:
    host: !!js process.env.DSH_GATEWAY_HOST ?? ctx.webStartup.host ?? '0.0.0.0'
    port: !!js Number(process.env.DSH_GATEWAY_PORT ?? (ctx.webStartup.port || 3080))
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: deepseek-account
  config:
    # Every official login entry point (desktop welcome window, Settings account
    # page, desktop onboarding quota page, the deepseek-account model provider)
    # goes through ctx.deepseekAccount and only ever talks to this origin.
    # Pointing it here is what makes "every official login uses Platform" true.
    platformOrigin: 'https://www.czmanong.com'
    # The original expression from packages/bundle/base/cordis.patch.yml: only a
    # real desktop profile on macOS or Windows reports a desktop platform, which
    # is what makes Platform's native client identity headers correct.
    desktopPlatform: !!js "ctx.get('profileContext')?.name === 'desktop' && ['darwin', 'win32'].includes(process.platform) ? process.platform : null"
    # Accepted only for an explicitly enabled loopback HTTP origin: local
    # development points platformOrigin at http://127.0.0.1:13090, and without
    # this the provider rejects that origin at load.
    allowLoopbackHttp: !!js process.env.DSH_PLATFORM_ALLOW_LOOPBACK_HTTP !== '0'
    # Kept at the upstream defaults on purpose. Change these only with a reason:
    # inferenceOrigin must match the llm route's own baseURL, which the model
    # route work (see platform/README.md) has not wired to this product yet.
    embeddedPageDist: ''
    inferenceOrigin: 'https://api.deepseek.com'
    rewriteBrowserOrigin: false
    requestTimeoutMs: 30000
    balanceTimeoutMs: 30000
    logoutMaxRetries: 5
    logoutRetryDelayMs: 1000
    attemptTimeoutMs: 600000

# ---------------------------------------------------------------------------
# 模型目录（`llm-pi-ai` / `agent-default-model`）**不在这份清单里**
#
# 不是省事，而是这一层会让模型页彻底写不进去。`config-editor.edit()`
# (`packages/boot/config-editor/src/index.ts:136-141`) 只在「合成后的生效配置」等于
# 「即将写入的配置」时才接受写入，而 `readProfilePatches`
# (`packages/boot/app-boot/src/profile-context.ts:63-73`) 把本层排在 profile 层**之后** ——
# 所以本层一旦占了 `llm-pi-ai` 这个 id，它永远是最后一句，设置 › 模型 的每一次写入
# （添加模型提供商 › 自定义模型 API、编辑码农AI 的模型目录）都被拒：
#
#   Configuration for "llm-pi-ai" is overridden by a home patch or command-line overlay
#
# `agent-default-model` 有同一个缺陷、同一个出口：`AgentDefaultModelConfig.saveSelection()`
# (`packages/core/agent-default-model/src/index.ts:82-94`) 走的是同一个 `configEditor.edit`。
#
# 目录因此改由 `platform/provision.mjs` 写进**每个 profile 自己的** patch 层
# (`ensureProfileCatalog`)：对运行时等价（本层不再提供同样的值，改由 profile 层提供，
# 实测 `--dump-config` 逐行一致，只差每层的来源注释），而对模型页是它认的 override。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 关掉官方 DeepSeek 直连这条 route —— 也就是内置的那张 DeepSeek 卡片
#
# 用户口径：「原本自带的deepseek这个模型配置可以去掉，添加模型供应商时可以选择添加
# 官方的模型。但是默认的可以去掉，默认的只有码农ai这一个模型服务」。
#
# 这张卡片就是 `deepseek-official` 这条 route，由本行注册
# (`packages/llm/llm-deepseek-api-key/src/index.ts:15,36-38`)，`settingsPath: []`。
# 空的 settingsPath 在模型页的定义里「永远已配置」
# (`ui-settings-models/src/client/store.ts:205-206`)，于是它永远出现在卡片列表
# (`ModelsSection.tsx:341,398`)，而且既不可 add (`:343-346`) 也不可 remove (`:208-210`)。
# 也就是说：**没有任何「不改上游」的口子能在保留这条 route 的同时把它藏起来** ——
# 唯一的杠杆就是在部署层关掉它，和本文件已经关掉的 `llm-deepseek-account` 一样。
#
# 关掉**不等于**官方模型不可用：官方模型改从 `llm-pi-ai` 的目录里添加。
# `llm-pi-ai` 把已装 pi-ai 目录里的**每一个** provider 都声明成可配置项
# (`llm-pi-ai/src/index.ts:124-146`，目录来自 `catalog.ts:192-205`)，其中就有 `deepseek`
# （`baseUrl: https://api.deepseek.com`，模型 `deepseek-flash`＝DeepSeek V4.1 Flash 与
# `deepseek-v4-pro`）—— 未配置的目录项正是「添加模型提供商 › 第三方模型提供商」列出的东西。
#
# 只关这一条 route：`web-search-deepseek` 用的是自己的 `ctx.web` 身份
# (`web-search-deepseek/src/provider.ts:27`)，从不碰 `ctx.llm`；`deepseek-account`
# （登录 / 余额 / 退登）必须留着。
# ---------------------------------------------------------------------------
- id: llm-deepseek
  disabled: true

# ---------------------------------------------------------------------------
# 关掉「账号直连推理」这条 route
#
# `llm-deepseek-account`（`@deepseek-ai/dsh-llm-deepseek-account`）拿
# `ctx.deepseekAccount.resolveToken(baseURL)` 的**本地会话 JWT**，当作
# `x-dsh-auth-token` 发给 `baseURL`。而本产品那条 grant 只对**本产品的
# server** 有效（`resolveToken` 也只在 `new URL(baseURL).origin === inferenceOrigin`
# 时才返回它）——发给任何别的主机都是 401。
#
# 它俩在本产品下都走不通，而且 401 那条是**破坏性的**
# （`llm-deepseek-account/src/index.ts:26-36`）：
#
#   if (error.failure.status !== 401) return error
#   const rejected = new LlmError(error.message, 'ACCOUNT_TOKEN_INVALID', …)
#   try { await account?.rejectToken(token) } catch { … }
#   return rejected
#
# `PlatformAccount.rejectToken` → `expireCredential` 会
# **`credentials.deleteRecord(KEY)` 删掉本地 grant**，再发
# `deepseek-account/signed-out`（`deepseek-account-platform/src/index.ts:322-344`）。
# 也就是说：任何一次 401 都会把用户**登出**。
#
# 实测这个网关不认 `x-dsh-auth-token`（同一个有效 key：`x-dsh-auth-token` 401、
# `x-api-key` 200），所以这条 route 在本产品下只会产生 401 —— 一旦被选中就是
# 「用着用着回到登录页」。它必须**关掉**，而不是「留着不用」。
#
# ⚠️ 这条 route 被选中只是**已知的一条**登出路径，不是全部：见 README
# 「会话为什么会掉」一节列出的其余候选与各自需要什么证据。
#
# 注意**只关 LLM 这一条**：`deepseek-account`（登录/余额/退登那一条，
# `@deepseek-ai/dsh-deepseek-account-platform`）必须留着，否则整个官方账号面消失。
- id: llm-deepseek-account
  disabled: true
  config: {}

# ---------------------------------------------------------------------------
# 本 fork 自己的插件**不在这份清单里**
#
# 这里曾有一条 `insert`，把 `platform/host-auth.mjs` 直接插进 Loader。
# 那不是错，只是它满足不了产品要求：
#
# > 我希望把这个插件作为一个自定义插件，默认不启用。
#
# 官方「插件」页（`packages/client/ui-plugin-manager`）列的是**包**，不是 Loader 行
# （`pluginManager/listBundles`），并且用两个包级标志分两组：
# `installed || !optional` 进「已安装」，`optional && !installed` 进「官方」。
# 一行从 patch 文件插进去的行不属于任何包 —— 实测在真机桌面 Host 上，
# 它**能被 `listPlugins` 定位**（`patchId: dsharness-host-auth`），
# 但 `listBundles` 里没有它，所以页面上**没有卡片可切**。
#
# 所以自有的插件改由 `platform/provision.mjs` 装成**真正的组合包**：
# 包写在 `$DSH_HOME/dsharness-plugins/<name>/`，按需 `pnpm add` 进 profile，
# 是否启用由 `dsh.profile.bundles` 里有没有它决定 —— 也就是「已安装未选中」＝默认关闭，
# 用户在插件页点一下即可打开（走官方 `setBundleEnabled`，没有我们自己的机制）。
#
# ⚠️ 这里**也不要**为了「默认关闭」而在本层写 `disabled: true`：
# `readProfilePatches`（`packages/boot/app-boot/src/profile-context.ts:63`）的层序是
# **bundle 层 → profile 层 → home 层（本文件）→ overlay**，后应用的层覆盖前面的行，
# 于是本层的 `disabled` 会成为最后一句话，用户在插件页打开的开关永远不生效。
# 实测（`applyEntryPatches`）：
#
#   [profile(disabled=false), home(insert + disabled=true)] → disabled=true   ← 用户的开关被吃掉
#   [home(insert 不表态),     profile(disabled=true)]       → disabled=true   ← 默认关，且开关生效
#
# 因此本文件只保留上面那条「改官方已声明的行」的配置补丁，己方插件一律走组合包。
# ---------------------------------------------------------------------------
