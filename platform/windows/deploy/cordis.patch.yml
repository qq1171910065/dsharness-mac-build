# dsharness deployment rows.
#
# This file is the fork's own patch layer. It targets rows that upstream already
# declares, so it contains no new plugin: it only changes what the official
# harness points at.
#
# A patch replaces the targeted row's WHOLE config, so the entry below restates
# every key that row owns. See platform/README.md for why each key is there.
#
# name is deliberately omitted: in a non-insert patch name is an assertion, and a
# mismatch makes the patch silently SKIP with a warning. Leaving it out means an
# upstream package rename cannot turn this deployment back into "login talks to
# DeepSeek". The row is identified by id alone.

- id: deepseek-account
  config:
    # Every official login entry point (desktop welcome window, Settings account
    # page, desktop onboarding quota page, the deepseek-account model provider)
    # goes through ctx.deepseekAccount and only ever talks to this origin.
    # Pointing it here is what makes "every official login uses Platform" true.
    platformOrigin: 'https://www.czmanong.com'
    # The original expression from packages/bundle/base/cordis.patch.yml: only a
    # real desktop profile on macOS or Windows reports a desktop platform, which
    # is what makes Platform's native client identity headers correct.
    desktopPlatform: !!js "ctx.get('profileContext')?.name === 'desktop' && ['darwin', 'win32'].includes(process.platform) ? process.platform : null"
    # Accepted only for an explicitly enabled loopback HTTP origin: local
    # development points platformOrigin at http://127.0.0.1:13090, and without
    # this the provider rejects that origin at load.
    allowLoopbackHttp: !!js process.env.DSH_PLATFORM_ALLOW_LOOPBACK_HTTP !== '0'
    # Kept at the upstream defaults on purpose. Change these only with a reason:
    # inferenceOrigin must match the llm route's own baseURL, which the model
    # route work (see platform/README.md) has not wired to this product yet.
    embeddedPageDist: ''
    inferenceOrigin: 'https://api.deepseek.com'
    rewriteBrowserOrigin: false
    requestTimeoutMs: 30000
    balanceTimeoutMs: 30000
    logoutMaxRetries: 5
    logoutRetryDelayMs: 1000
    attemptTimeoutMs: 600000

# ---------------------------------------------------------------------------
# 模型渠道：本产品自己的网关，不是 DeepSeek 官方
#
# 上游把默认模型选成 `agent-default-model: {provider: deepseek-official,
# model: deepseek-flash}`，而 `deepseek-official` 这个 route 由
# `@deepseek-ai/dsh-llm-deepseek-api-key` 提供，displayName 硬编码为 `DeepSeek`、
# 端点是 api.deepseek.com（`llm-deepseek/src/config.ts:106` 的 PUBLIC_BASE_URL），
# 目录里也只有 `deepseek-flash` / `deepseek-v4-pro`。
#
# 所以「默认就是本产品网关、默认就是 deepseek-v4.1-flash」**不能**靠改那一行实现 ——
# 那要改上游包的 displayName 与模型目录。改用上游本来就提供、且默认挂载但空着的
# `llm-pi-ai`（`packages/bundle/base/cordis.patch.yml:127` 注释写的就是
# 「zero routes … until a `llm-pi-ai:` settings section supplies provider
# profiles」）：profile 的 key 就是 route，displayName 由我们给。
#
# `baseURL`/`api`/`models`/`defaultModelId` 与 `/api/config` 下发的是同一份口径
# （`server/src/lib/defaults.ts`）：网关公开入口 + /v1、openai-completions、
# 目录里只有 deepseek-v4.1-flash。`apiKeyEnv` 指向本产品为每个用户签发的
# sk-（由 `platform/model-key.mjs` 在登录后写进凭据层）。
#
# `agent-default-model` 是**覆盖**（上游已声明这一行），配置也是整块替换。
- id: llm-pi-ai
  config:
    providers:
      dsharness-relay:
        displayName: '码农AI'
        api: 'openai-completions'
        baseURL: 'https://ai.czmanong.com/v1'
        apiKeyEnv: 'DSHARNESS_MODEL_KEY'
        models:
          - id: 'deepseek-v4.1-flash'
            name: 'DeepSeek V4.1 Flash'
            contextWindow: 262144
            maxTokens: 32768
            input: ['text', 'image']

- id: agent-default-model
  config:
    provider: 'dsharness-relay'
    model: 'deepseek-v4.1-flash'

# ---------------------------------------------------------------------------
# 关掉「账号直连推理」这条 route
#
# `llm-deepseek-account`（`@deepseek-ai/dsh-llm-deepseek-account`）拿
# `ctx.deepseekAccount.resolveToken(baseURL)` 的**本地会话 JWT**，当作
# `x-dsh-auth-token` 发给 `baseURL`。而本产品那条 grant 只对**本产品的
# server** 有效（`resolveToken` 也只在 `new URL(baseURL).origin === inferenceOrigin`
# 时才返回它）——发给任何别的主机都是 401。
#
# 它俩在本产品下都走不通，而且 401 那条是**破坏性的**
# （`llm-deepseek-account/src/index.ts:26-36`）：
#
#   if (error.failure.status !== 401) return error
#   const rejected = new LlmError(error.message, 'ACCOUNT_TOKEN_INVALID', …)
#   try { await account?.rejectToken(token) } catch { … }
#   return rejected
#
# `PlatformAccount.rejectToken` → `expireCredential` 会
# **`credentials.deleteRecord(KEY)` 删掉本地 grant**，再发
# `deepseek-account/signed-out`（`deepseek-account-platform/src/index.ts:322-344`）。
# 也就是说：任何一次 401 都会把用户**登出**。
#
# 实测这个网关不认 `x-dsh-auth-token`（同一个有效 key：`x-dsh-auth-token` 401、
# `x-api-key` 200），所以这条 route 在本产品下只会产生 401 —— 一旦被选中就是
# 「用着用着回到登录页」。它必须**关掉**，而不是「留着不用」。
#
# ⚠️ 这条 route 被选中只是**已知的一条**登出路径，不是全部：见 README
# 「会话为什么会掉」一节列出的其余候选与各自需要什么证据。
#
# 注意**只关 LLM 这一条**：`deepseek-account`（登录/余额/退登那一条，
# `@deepseek-ai/dsh-deepseek-account-platform`）必须留着，否则整个官方账号面消失。
- id: llm-deepseek-account
  disabled: true
  config: {}

# ---------------------------------------------------------------------------
# 本 fork 自己的插件**不在这份清单里**
#
# 这里曾有一条 `insert`，把 `platform/host-auth.mjs` 直接插进 Loader。
# 那不是错，只是它满足不了产品要求：
#
# > 我希望把这个插件作为一个自定义插件，默认不启用。
#
# 官方「插件」页（`packages/client/ui-plugin-manager`）列的是**包**，不是 Loader 行
# （`pluginManager/listBundles`），并且用两个包级标志分两组：
# `installed || !optional` 进「已安装」，`optional && !installed` 进「官方」。
# 一行从 patch 文件插进去的行不属于任何包 —— 实测在真机桌面 Host 上，
# 它**能被 `listPlugins` 定位**（`patchId: dsharness-host-auth`），
# 但 `listBundles` 里没有它，所以页面上**没有卡片可切**。
#
# 所以自有的插件改由 `platform/provision.mjs` 装成**真正的组合包**：
# 包写在 `$DSH_HOME/dsharness-plugins/<name>/`，按需 `pnpm add` 进 profile，
# 是否启用由 `dsh.profile.bundles` 里有没有它决定 —— 也就是「已安装未选中」＝默认关闭，
# 用户在插件页点一下即可打开（走官方 `setBundleEnabled`，没有我们自己的机制）。
#
# ⚠️ 这里**也不要**为了「默认关闭」而在本层写 `disabled: true`：
# `readProfilePatches`（`packages/boot/app-boot/src/profile-context.ts:63`）的层序是
# **bundle 层 → profile 层 → home 层（本文件）→ overlay**，后应用的层覆盖前面的行，
# 于是本层的 `disabled` 会成为最后一句话，用户在插件页打开的开关永远不生效。
# 实测（`applyEntryPatches`）：
#
#   [profile(disabled=false), home(insert + disabled=true)] → disabled=true   ← 用户的开关被吃掉
#   [home(insert 不表态),     profile(disabled=true)]       → disabled=true   ← 默认关，且开关生效
#
# 因此本文件只保留上面那条「改官方已声明的行」的配置补丁，己方插件一律走组合包。
# ---------------------------------------------------------------------------
